        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background-color: #1a1a1a; }

        .top-bar {
            position: fixed; top: 15px; left: 20px; z-index: 99999;

            padding: 8px 16px; border-radius: 20px; font-size: 14px;

            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        }

        .legend-group {
            display: flex; gap: 10px; align-items: center; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 12px;
        }

        .legend-item { display: flex; align-items: center; gap: 4px; font-size: 13px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .legend-dot.key { background-color: #ff5500; box-shadow: 0 0 6px #ff5500; }
        .legend-dot.bg { background-color: #d4a373; opacity: 0.8; }

        .top-bar button {
            background: #ff5500; border: none; color: white; padding: 4px 10px;
            border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;
        }

        .scroll-container {
            width: 100%; height: 100vh; overflow-x: auto; overflow-y: hidden;
            white-space: nowrap; position: relative; background-color: #0d0d0d;
            display: flex; align-items: center;
        }

        .map-wrapper { position: relative; display: inline-block; height: 85vh; }
        .map-wrapper img { height: 100%; display: block; pointer-events: none; }

        /* 呼吸光点样式 - 默认背景人物 */
        .hotspot {
            position: absolute; width: 22px; height: 22px;
            background-color: rgba(212, 163, 115, 0.65); border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 8px rgba(212, 163, 115, 0.4);
            animation: pulse-bg 2s infinite ease-in-out;
            transform: translate(-50%, -50%); z-index: 99998;
        }

        /* 关键核心人物光点样式 */
        .hotspot.key-character {
            width: 26px; height: 26px;
            background-color: #ff5500; border: 3px solid #ffffff;
            box-shadow: 0 0 15px #ff5500, 0 0 30px #ff5500;
            animation: pulse-key 1.5s infinite ease-in-out;
            z-index: 99999;
        }

        .hotspot-label {
            position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); color: #fff; padding: 3px 8px; font-size: 12px;
            border-radius: 4px; white-space: nowrap; pointer-events: none; display: none;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .edit-mode .hotspot-label { display: block; }
        .edit-mode .hotspot { cursor: move; animation: none; border-color: #ffff00; }

        @keyframes pulse-key {
            0% { transform: translate(-50%, -50%) scale(0.9); box-shadow: 0 0 6px #ff5500; }
            50% { transform: translate(-50%, -50%) scale(1.3); box-shadow: 0 0 22px #ffaa00; }
            100% { transform: translate(-50%, -50%) scale(0.9); box-shadow: 0 0 6px #ff5500; }
        }

        @keyframes pulse-bg {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.6; }
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); z-index: 999999;
            justify-content: center; align-items: center; white-space: normal;
        }

        .modal-card {
            width: 520px; max-width: 90%; max-height: 85vh; overflow-y: auto;
            background: #f7f3e8; border-radius: 12px;
            padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 2px solid #8c684d; position: relative;
        }
        .modal-close { position: absolute; top: 12px; right: 16px; font-size: 24px; color: #8c684d; cursor: pointer; font-weight: bold; }
        .character-name { font-size: 22px; font-weight: bold; color: #4a2c11; margin-bottom: 4px; }
        .character-pos { font-size: 13px; color: #9c6b4e; margin-bottom: 8px; font-weight: bold; }
        .character-native { font-size: 14px; color: #7a5c43; font-weight: bold; margin-bottom: 4px; }
        .character-job { font-size: 14px; color: #7a5c43; margin-bottom: 12px; border-bottom: 2px solid #d4c5b3; padding-bottom: 8px; }
        .character-story { font-size: 14px; color: #2c2520; line-height: 1.6; background: #eae3d2; padding: 12px; border-radius: 6px; }

        let isEditMode = false;

        function renderHotspots() {
            const mapWrapper = document.getElementById('mapWrapper');
            mapWrapper.querySelectorAll('.hotspot').forEach(el => el.remove());

            charactersData.forEach(person => {
                const hotspot = document.createElement('div');
                
                // 判断是否为关键核心人物，赋予不同类名以实现不同的颜色与动画
                const isKey = keyCharacterIds.includes(person.id);
                hotspot.className = isKey ? 'hotspot key-character' : 'hotspot';
                
                hotspot.style.left = person.left + '%';
                hotspot.style.top = person.top + '%';
                hotspot.id = person.id;
                
                const label = document.createElement('div');
                label.className = 'hotspot-label';
                label.innerText = person.name;
                hotspot.appendChild(label);

                hotspot.addEventListener('click', function(e) {
                    if (isEditMode) return;
                    e.stopPropagation();
                    openModal(person);
                });

                hotspot.addEventListener('mousedown', startDrag);
                mapWrapper.appendChild(hotspot);
            });
        }

        function startDrag(e) {
            if (!isEditMode) return;
            e.stopPropagation();
            const hotspot = e.currentTarget;
            const mapWrapper = document.getElementById('mapWrapper');
            const rect = mapWrapper.getBoundingClientRect();

            function onMouseMove(moveEvent) {
                let currentX = moveEvent.clientX - rect.left;
                let currentY = moveEvent.clientY - rect.top;
                
                let leftPct = Math.max(0, Math.min(100, (currentX / rect.width) * 100)).toFixed(2);
                let topPct = Math.max(0, Math.min(100, (currentY / rect.height) * 100)).toFixed(2);

                hotspot.style.left = leftPct + '%';
                hotspot.style.top = topPct + '%';

                const p = charactersData.find(item => item.id === hotspot.id);
                if (p) {
                    p.left = parseFloat(leftPct);
                    p.top = parseFloat(topPct);
                }
            }

            function onMouseUp() {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            }

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const container = document.body;
            const btn = document.getElementById('editBtn');
            const exportBtn = document.getElementById('exportBtn');
            if (isEditMode) {
                container.classList.add('edit-mode');
                btn.innerText = "退出微调模式";
                btn.style.background = "#6c757d";
                exportBtn.style.display = "inline-block";
            } else {
                container.classList.remove('edit-mode');
                btn.innerText = "进入微调定位模式";
                btn.style.background = "#ff5500";
                exportBtn.style.display = "none";
            }
        }

        function exportCoords() {
            console.log(JSON.stringify(charactersData, null, 2));
            alert("最新精准坐标数据已输出到浏览器的控制台（F12 -> Console）！");
        }

        window.addEventListener('DOMContentLoaded', () => {
            const img = document.getElementById('mapImage');
            if (img.complete && img.naturalHeight !== 0) {
                renderHotspots();
            } else {
                img.onload = renderHotspots;
            }
            setTimeout(renderHotspots, 200);
        });

        function openModal(person) {
            document.getElementById('modalName').innerText = person.name;
            document.getElementById('modalPos').innerText = person.pos;
            document.getElementById('modalNative').innerText = person.native;
            document.getElementById('modalJob').innerText = person.job;
            document.getElementById('modalStory').innerText = person.story;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
        document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
    </script>
